name: Update market data

on:
  schedule:
    - cron: '13,43 6-19 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update market data"
          # One retry (rebase on top of anything pushed meanwhile) before
          # giving up; either way the site still deploys below from the
          # freshly-fetched data.json already on disk in this run, so a
          # push failure here never skips publishing this run's numbers.
          git push || (git pull --rebase && git push) || echo "push failed after retry - deploying local data.json anyway"

      # Commits made with the default GITHUB_TOKEN don't trigger other
      # workflows (incl. the push-triggered pages.yml), so this job deploys
      # to Pages itself instead of relying on that push event.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
